# /etc/nginx/conf.d/helper.conf
# 购彩辅助工具公网反向代理配置（仅代理 127.0.0.1:8100）
# 使用前替换 example.com 与证书路径，并确认已安装 certbot。

limit_req_zone $binary_remote_addr zone=helper_auth:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=helper_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=helper_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    server_tokens off;

    # 限流触发时统一返回 429，避免被监控计为 5xx
    limit_req_status 429;
    limit_conn_status 429;

    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # 阻断隐藏文件与常见扫描路径
    location ~ /\.(?!well-known) {
        return 404;
    }

    location ~* (wp-admin|wp-login|phpmyadmin|actuator|/\.env|/\.git) {
        return 404;
    }

    # API 文档不对外暴露（即使后端误开）
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # 登录 / 注册：独立严格限流
    location = /api/helper/auth/login {
        limit_req zone=helper_auth burst=5 nodelay;
        limit_conn helper_conn 10;
        proxy_pass http://127.0.0.1:8100;
        include /etc/nginx/snippets/helper-proxy.conf;
    }

    location = /api/helper/auth/register {
        limit_req zone=helper_auth burst=3 nodelay;
        limit_conn helper_conn 10;
        proxy_pass http://127.0.0.1:8100;
        include /etc/nginx/snippets/helper-proxy.conf;
    }

    location /api/ {
        limit_req zone=helper_api burst=30 nodelay;
        limit_conn helper_conn 20;
        proxy_pass http://127.0.0.1:8100;
        include /etc/nginx/snippets/helper-proxy.conf;
    }

    location / {
        limit_req zone=helper_api burst=60 nodelay;
        limit_conn helper_conn 20;
        proxy_pass http://127.0.0.1:8100;
        include /etc/nginx/snippets/helper-proxy.conf;
    }
}
