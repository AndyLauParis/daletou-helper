<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>注册 · 全国彩票购彩辅助工具</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/theme.js"></script>
</head>
<body class="auth-page">
  <div id="site-nav"></div>

  <main class="auth-shell">
    <aside class="auth-aside">
      <p><strong>全国彩票购彩辅助工具</strong></p>
      <h2 class="auth-aside-title">免费注册后可以做什么</h2>
      <p>注册只需用户名与密码，不收集真实姓名、身份证、手机号或银行卡信息。</p>
      <ul class="auth-aside-list">
        <li>建立专属号码本，长期跟踪自选号码</li>
        <li>设置购彩预算与提醒，控制支出节奏</li>
        <li>自动核对官方开奖，省去手动比对</li>
      </ul>
    </aside>

    <div class="auth-main">
      <section class="auth-card">
        <p class="auth-brand">全国彩票购彩辅助工具</p>
        <h1 class="auth-title">创建账号</h1>
        <p class="auth-lead">仅需用户名与密码，不收集真实姓名、身份证、手机号或银行卡信息。</p>

        <form id="register-form" novalidate>
          <div class="field">
            <label for="username">用户名</label>
            <input id="username" name="username" type="text" autocomplete="username"
                   autocapitalize="none" spellcheck="false" maxlength="32" required>
            <p class="muted small">3–32 位字母、数字、下划线或中文。</p>
          </div>
          <div class="field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password"
                   autocomplete="new-password" maxlength="128" required>
            <p class="muted small">至少 8 位，最多 128 位。</p>
          </div>
          <div class="field">
            <label for="password2">确认密码</label>
            <input id="password2" name="password2" type="password"
                   autocomplete="new-password" maxlength="128" required>
          </div>

          <div class="field">
            <label for="invite-code">邀请码（可选）</label>
            <input id="invite-code" name="invite_code" type="text"
                   autocomplete="off" spellcheck="false" maxlength="128">
            <p class="muted small">站点启用邀请注册时请填写管理员提供的邀请码，开放注册时可留空。</p>
          </div>

          <div class="field">
            <label class="checkbox-row" for="is-adult">
              <input id="is-adult" name="is_adult" type="checkbox" required>
              <span>我已满 18 周岁，已阅读并同意合规声明：本工具仅提供记录、查询与提醒，不代购、不支付、不出票、不承诺中奖。</span>
            </label>
          </div>

          <div class="form-error" id="form-error" role="alert" hidden></div>

          <button class="btn btn-primary btn-block" type="submit" id="submit-btn">注册并登录</button>
        </form>

        <p class="auth-switch muted">已有账号？<a href="/login">去登录</a></p>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/register.js"></script>
</body>
</html>
