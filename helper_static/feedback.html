<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="意见反馈：提交功能建议、问题反馈或体验问题，并查看自己的历史反馈记录。">
  <title>意见反馈 · 全国彩票购彩辅助工具</title>
  <link rel="stylesheet" href="/static/css/app.css?v=20261126">
  <script src="/static/js/theme.js?v=20261126"></script>
</head>
<body>
  <div id="site-nav"></div>

  <main class="page">
    <div class="container">
      <section class="page-head">
        <p class="hero-eyebrow">意见反馈</p>
        <h1 class="page-title">帮助我们改进工具</h1>
        <p class="page-lead">
          可以提交功能建议、使用中遇到的问题或体验意见。反馈需要登录后提交，
          历史记录仅你自己可见。
        </p>
      </section>

      <div class="feedback-layout">
        <section class="card">
          <h2 class="section-title">提交反馈</h2>
          <form id="feedback-form" novalidate>
            <fieldset class="field feedback-types">
              <legend>问题类型</legend>
              <div class="type-grid">
                <label class="type-chip">
                  <input type="radio" name="category" value="suggestion" checked>
                  <span>功能建议</span>
                </label>
                <label class="type-chip">
                  <input type="radio" name="category" value="bug">
                  <span>问题反馈</span>
                </label>
                <label class="type-chip">
                  <input type="radio" name="category" value="experience">
                  <span>体验问题</span>
                </label>
                <label class="type-chip">
                  <input type="radio" name="category" value="other">
                  <span>其他</span>
                </label>
              </div>
            </fieldset>

            <div class="field">
              <label for="feedback-content">反馈内容</label>
              <textarea id="feedback-content" maxlength="1000" required
                placeholder="请尽量描述清楚操作步骤、预期结果和实际现象，便于我们定位问题。"></textarea>
              <p class="hint"><span id="feedback-count">0</span> / 1000，至少 5 个字符。</p>
            </div>

            <div class="field">
              <label for="feedback-file">截图（可选）</label>
              <div class="upload-zone" id="upload-zone">
                <label class="upload-pick" for="feedback-file">选择截图</label>
                <input id="feedback-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
                <p class="hint">
                  支持 PNG、JPG、WebP，单张不超过 5 MB，也可以把图片拖到这里。
                  请勿上传身份证件、购彩凭证等敏感信息。
                </p>
              </div>
              <div class="upload-preview" id="upload-preview" hidden>
                <img id="upload-image" alt="截图预览">
                <div class="upload-preview-meta">
                  <p class="small" id="upload-name"></p>
                  <button class="btn btn-ghost btn-sm" type="button" id="upload-remove">移除截图</button>
                </div>
              </div>
            </div>

            <div class="form-error" id="feedback-error" role="alert" hidden></div>
            <p class="form-success" id="feedback-success" role="status" hidden></p>

            <div class="row-actions">
              <button class="btn btn-primary" type="submit" id="feedback-submit">提交反馈</button>
            </div>
          </form>
        </section>

        <section class="card feedback-history">
          <div class="fav-toolbar">
            <div>
              <h2 class="section-title">历史反馈</h2>
              <p class="hint" id="feedback-total">仅显示当前账号提交的记录。</p>
            </div>
            <button class="btn btn-ghost btn-sm" type="button" id="feedback-refresh">刷新</button>
          </div>
          <div class="feedback-list" id="feedback-list" aria-live="polite"></div>
          <div class="empty-state" id="feedback-empty" hidden>
            <p class="empty-title">还没有提交过反馈</p>
            <p class="hint">提交后可以在这里查看处理记录与截图。</p>
          </div>
        </section>
      </div>

      <p class="hint">
        反馈仅用于改进工具，不影响开奖数据与任何购彩结果；本工具不提供购彩建议。
      </p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/static/js/common.js?v=20261126"></script>
  <script src="/static/js/feedback.js?v=20261126"></script>
</body>
</html>
