<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>登录 · 全国彩票购彩辅助工具</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/theme.js"></script>
</head>
<body class="auth-page">
  <div id="site-nav"></div>

  <main class="auth-shell">
    <aside class="auth-aside">
      <p><strong>全国彩票购彩辅助工具</strong></p>
      <h2 class="auth-aside-title">记录号码，管理预算，查询开奖</h2>
      <p>把自选号码、购彩预算和开奖结果集中在一处，省去分散记录与手动比对的麻烦。</p>
      <ul class="auth-aside-list">
        <li>仅提供记录、查询与提醒，不代购、不支付、不出票</li>
        <li>开奖与奖池数据以官方发布为准</li>
        <li>18+ 理性购彩，量力而行</li>
      </ul>
    </aside>

    <div class="auth-main">
      <section class="auth-card">
        <p class="auth-brand">全国彩票购彩辅助工具</p>
        <h1 class="auth-title">账号登录</h1>
        <p class="auth-lead">登录后可同步号码本、预算与提醒设置。所有数据仅用于记录与查询。</p>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="username">用户名</label>
            <input id="username" name="username" type="text" autocomplete="username"
                   autocapitalize="none" spellcheck="false" maxlength="32" required>
          </div>
          <div class="field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" maxlength="128" required>
          </div>

          <div class="form-error" id="form-error" role="alert" hidden></div>

          <button class="btn btn-primary btn-block" type="submit" id="submit-btn">登录</button>
        </form>

        <p class="auth-switch muted">还没有账号？<a href="/register">立即注册</a></p>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
