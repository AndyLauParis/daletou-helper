<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>登录 · 全国彩票购彩辅助工具</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div id="site-nav"></div>

  <main class="page">
    <div class="container narrow">
      <section class="card auth-card">
        <h1 class="page-title">账号登录</h1>
        <p class="page-lead">登录后可同步号码本、预算与提醒设置。所有数据仅用于记录与查询。</p>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="username">用户名</label>
            <input id="username" name="username" type="text" autocomplete="username"
                   autocapitalize="none" spellcheck="false" maxlength="32" required>
          </div>
          <div class="field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" maxlength="128" required>
          </div>

          <div class="form-error" id="form-error" role="alert" hidden></div>

          <button class="btn btn-primary btn-block" type="submit" id="submit-btn">登录</button>
        </form>

        <p class="auth-switch muted">还没有账号？<a href="/register">立即注册</a></p>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/static/js/common.js"></script>
  <script>
    (function () {
      mountShell("");

      var form = document.getElementById("login-form");
      var errorBox = document.getElementById("form-error");
      var submitBtn = document.getElementById("submit-btn");

      function showError(message) {
        errorBox.textContent = message;
        errorBox.hidden = false;
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        errorBox.hidden = true;

        var username = document.getElementById("username").value.trim();
        var password = document.getElementById("password").value;

        if (!username || !password) {
          showError("请输入用户名和密码");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "登录中…";
        try {
          var data = await api("/api/helper/auth/login", {
            method: "POST",
            body: JSON.stringify({ username: username, password: password })
          });
          setToken(data.token);
          window.location.href = "/";
        } catch (err) {
          showError(err.message || "登录失败，请稍后重试");
          submitBtn.disabled = false;
          submitBtn.textContent = "登录";
        }
      });
    })();
  </script>
</body>
</html>
