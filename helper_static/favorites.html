<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="我的收藏：集中查看已收藏的工具与页面。收藏仅保存在当前浏览器本地。">
  <title>我的收藏 · 全国彩票购彩辅助工具</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/theme.js"></script>
</head>
<body>
  <div id="site-nav"></div>

  <main class="page">
    <div class="container">
      <section class="page-head">
        <p class="hero-eyebrow">我的收藏</p>
        <h1 class="page-title">常用工具，一处直达</h1>
        <p class="page-lead">
          收藏保存在当前浏览器的本地存储中，不会上传到服务器，也不跨设备同步。
          在多个标签页之间修改收藏时，列表会自动更新。
        </p>
      </section>

      <section class="card">
        <div class="fav-toolbar">
          <div>
            <strong id="fav-count">暂无收藏</strong>
            <p class="hint">点击工作台磁贴或任意页面右上角的星标，即可收藏或取消收藏。</p>
          </div>
          <div class="row-actions">
            <a class="btn btn-ghost btn-sm" href="/app" id="fav-back">返回工作台</a>
            <button class="btn btn-ghost btn-sm" type="button" id="fav-clear" disabled>清空收藏</button>
          </div>
        </div>
        <div class="fav-list" id="fav-list" aria-live="polite"></div>
        <div class="empty-state" id="fav-empty" hidden>
          <p class="empty-title">还没有收藏内容</p>
          <p class="hint">把常用的工具或页面加入收藏，下次可以从这里快速打开。</p>
          <a class="btn btn-primary btn-sm" href="/app">去工作台看看</a>
        </div>
      </section>

      <p class="hint">
        收藏只是本地快捷入口，不改变工具功能，也不构成任何购彩建议。
      </p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/favorites.js"></script>
</body>
</html>
