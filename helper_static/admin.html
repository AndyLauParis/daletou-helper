<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="管理后台：查看注册用户、反馈处理状态与基础使用统计。">
  <title>管理后台 · 全国彩票购彩辅助工具</title>
  <link rel="stylesheet" href="/static/css/app.css?v=20261126">
  <script src="/static/js/theme.js?v=20261126"></script>
</head>
<body>
  <div id="site-nav"></div>

  <main class="page">
    <div class="container">
      <section class="page-head">
        <p class="hero-eyebrow">管理后台</p>
        <h1 class="page-title">运营概览与反馈处理</h1>
        <p class="page-lead">
          仅管理员可访问。这里可以查看注册用户、号码本与支出统计，
          并处理用户提交的反馈。请勿向他人转发后台截图。
        </p>
      </section>

      <div class="form-error" id="admin-error" role="alert" hidden></div>

      <div class="state-card" id="admin-denied" hidden>
        <p class="empty-title">无访问权限</p>
        <p class="hint">当前账号不是管理员，如需权限请联系站点维护者。</p>
        <a class="btn btn-primary" href="/app">返回首页</a>
      </div>

      <div id="admin-content" hidden>
        <div class="stat-grid" id="admin-stats" aria-live="polite"></div>

        <section class="card">
          <div class="fav-toolbar">
            <div>
              <h2 class="section-title">用户反馈</h2>
              <p class="hint" id="feedback-summary">加载中…</p>
            </div>
            <button class="btn btn-ghost btn-sm" type="button" id="admin-refresh">
              刷新全部
            </button>
          </div>

          <div class="toolbar">
            <div class="field">
              <label for="feedback-status">处理状态</label>
              <select id="feedback-status">
                <option value="all">全部</option>
                <option value="open">待处理</option>
                <option value="resolved">已处理</option>
              </select>
            </div>
            <div class="row-actions">
              <button class="btn btn-ghost btn-sm" type="button" id="feedback-refresh">
                刷新列表
              </button>
            </div>
          </div>

          <div class="feedback-list" id="admin-feedback-list" aria-live="polite"></div>
          <div class="empty-state" id="admin-feedback-empty" hidden>
            <p class="empty-title">没有符合条件的反馈</p>
            <p class="hint">切换状态筛选或稍后再来看。</p>
          </div>

          <div class="fav-toolbar">
            <p class="hint" id="feedback-page-info"></p>
            <div class="row-actions">
              <button class="btn btn-ghost btn-sm" type="button" id="feedback-prev">
                上一页
              </button>
              <button class="btn btn-ghost btn-sm" type="button" id="feedback-next">
                下一页
              </button>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="fav-toolbar">
            <div>
              <h2 class="section-title">注册用户</h2>
              <p class="hint" id="users-summary">加载中…</p>
            </div>
          </div>

          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">用户名</th>
                  <th scope="col">角色</th>
                  <th scope="col">注册时间</th>
                  <th scope="col">号码本</th>
                  <th scope="col">反馈</th>
                </tr>
              </thead>
              <tbody id="admin-users-body"></tbody>
            </table>
          </div>

          <div class="fav-toolbar">
            <p class="hint" id="users-page-info"></p>
            <div class="row-actions">
              <button class="btn btn-ghost btn-sm" type="button" id="users-prev">
                上一页
              </button>
              <button class="btn btn-ghost btn-sm" type="button" id="users-next">
                下一页
              </button>
            </div>
          </div>
        </section>

        <p class="hint">
          后台数据仅用于维护工具与改进体验；本工具不代购、不出票、不承诺中奖。
        </p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/static/js/common.js?v=20261126"></script>
  <script src="/static/js/admin.js?v=20261126"></script>
</body>
</html>
