<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>全部彩票游戏 · 全国彩票购彩辅助工具</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    .games-groups {
      display: flex;
      flex-direction: column;
      gap: 26px;
      margin-top: 20px;
    }

    .group-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .group-title {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
    }

    .group-count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .games-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .game-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .game-name {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
    }

    .game-code {
      display: inline-block;
      margin-top: 2px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-size: 12px;
      white-space: nowrap;
    }

    .badge-catalog {
      background: #f2f4f7;
      color: #475467;
    }

    .badge-ok {
      background: #ecfdf3;
      color: #067647;
    }

    .game-meta {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      gap: 6px 10px;
      margin: 0;
      font-size: 13px;
    }

    .game-meta dt {
      color: var(--muted);
      white-space: nowrap;
    }

    .game-meta dd {
      margin: 0;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .game-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
      padding-top: 4px;
    }

    .state-card {
      margin-top: 20px;
    }

    @media (min-width: 720px) {
      .games-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div id="site-nav"></div>

  <main class="page">
    <div class="container">
      <h1 class="page-title">全部彩票游戏</h1>
      <p class="page-lead">仅提供开奖查询、号码记录与提醒；不代购、不支付、不出票。</p>
      <p class="notice">
        开奖节奏、奖级与奖金以官方公告为准，如遇调整以官方为准；本工具不提供号码预测、推荐或任何交易能力。
      </p>

      <div id="games-root" aria-live="polite">
        <div class="card state-card muted">正在加载游戏目录…</div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/games.js"></script>
</body>
</html>
